[package]
name = "rust-css-parser"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Fault-tolerant CSS parser, validator, minifier and renderer: the Rust port of @tbela99/css-parser"
documentation = "https://docs.rs/rust-css-parser"
readme = "README.md"
keywords = ["css", "parser", "minifier", "validator", "sourcemap"]
categories = ["parser-implementations", "web-programming"]
# the published crate: the library, its embedded data and the readme. the binaries (src/bin) and the tests are
# development tools of the repository (the tests read the package.json of the repository)
include = [
    "/Cargo.toml",
    "/build.rs",
    "/README.md",
    "/LICENSE.md",
    "/src/**/*.rs",
    "/src/data/properties.json",
    "/src/data/validation.json",
    "!/src/bin/**",
]

[lib]
crate-type = ["rlib"]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
